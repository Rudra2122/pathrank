# Local production-shaped stack: Redis online store, Triton, the API, Prometheus.
#   1) run the pipeline with configs/careerbuilder.yaml and --set featurestore.online=redis
#      (with this compose's redis up), so features are materialized into Redis
#   2) docker compose -f deploy/docker-compose.yml up
# On a Mac, Triton runs CPU-only (drop the gpu reservation); on an NVIDIA box keep it.
#
# Streaming path (profile "streaming", not started by a plain `up`):
#   docker compose -f deploy/docker-compose.yml --profile streaming up -d kafka minio
#   Kafka: single broker in KRaft mode (no ZooKeeper) on localhost:9092
#   MinIO: S3 API on localhost:9000, console on localhost:9001 (minioadmin / minioadmin), bucket "pathrank"
#   Spark runs on the host (PySpark local mode), see streaming/README.md.
services:
  redis:
    image: redis:7
    ports: ["6379:6379"]
  triton:
    image: nvcr.io/nvidia/tritonserver:${TRITON_TAG:-24.08}-py3
    command: tritonserver --model-repository=/models --model-control-mode=explicit
             --load-model=user_tower --load-model=item_tower --load-model=ranker
    volumes: ["../artifacts/careerbuilder/v1/model_repository:/models"]
    ports: ["8000:8000", "8002:8002"]
    shm_size: 1g
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
  api:
    build: ..
    environment:
      PATHRANK_CONFIG: configs/careerbuilder.yaml
      TRITON_URL: triton:8000
      PATHRANK_SET: featurestore.online=redis featurestore.redis_url=redis:6379
    depends_on: [redis, triton]
    ports: ["8080:8080"]
  prometheus:
    image: prom/prometheus
    volumes: ["../configs/prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]

  kafka:
    image: apache/kafka:3.9.0
    profiles: [streaming]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms1g -Xmx1g
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
  minio:
    # minio/minio was removed from Docker Hub (Sep 2026) and quay.io needs a login now.
    # Chainguard's build pulls without an account (only :latest is free). It runs as a non-root
    # user by default; root here so it can write the fresh named volume.
    image: cgr.dev/chainguard/minio:latest
    profiles: [streaming]
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
  # no mc container: the "pathrank" bucket is created from Python on first use
  # (pathrank/streaming/spark.py: ensure_bucket)

volumes:
  kafka-data:
  minio-data:
