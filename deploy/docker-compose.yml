# Local production-shaped stack: Redis online store, Triton, the API, Prometheus.
#   1) run the pipeline with configs/careerbuilder.yaml and --set featurestore.online=redis
#      (with this compose's redis up), so features are materialized into Redis
#   2) docker compose -f deploy/docker-compose.yml up
# On a Mac, Triton runs CPU-only (drop the gpu reservation); on an NVIDIA box keep it.
services:
  redis:
    image: redis:7
    ports: ["6379:6379"]
  triton:
    image: nvcr.io/nvidia/tritonserver:${TRITON_TAG:-24.08}-py3
    command: tritonserver --model-repository=/models --model-control-mode=explicit
             --load-model=user_tower --load-model=item_tower --load-model=ranker
    volumes: ["../artifacts/careerbuilder/v1/model_repository:/models"]
    ports: ["8000:8000", "8002:8002"]
    shm_size: 1g
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
  api:
    build: ..
    environment:
      PATHRANK_CONFIG: configs/careerbuilder.yaml
      TRITON_URL: triton:8000
      PATHRANK_SET: featurestore.online=redis featurestore.redis_url=redis:6379
    depends_on: [redis, triton]
    ports: ["8080:8080"]
  prometheus:
    image: prom/prometheus
    volumes: ["../configs/prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
