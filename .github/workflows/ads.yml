name: ads
# Java tests (JUnit 5, Mockito, Flink mini cluster, Testcontainers Kafka + Redis), then the whole
# ads path end to end on synthetic events: Flink job + Spring Boot server + click sim + k6.
# Numbers from this runner are not the README numbers (those come from the MacBook run on OLX data).
on:
  push:
    paths: ["ads/**", "deploy/docker-compose.yml", ".github/workflows/ads.yml"]
  pull_request:
    paths: ["ads/**"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17", cache: maven}
      - run: cd ads && mvn -B verify
  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17", cache: maven}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy pandas pyarrow httpx redis
      - run: REQUESTS=20000 DURATION=20s VUS=16 PY=python bash ads/bench/ads_bench.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: ads-results, path: "results/ads\nresults/RESULTS_ads.md\nlogs"}
