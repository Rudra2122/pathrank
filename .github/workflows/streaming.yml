name: streaming
# Builds the Java producer against the real kafka-clients, then runs the whole streaming path on
# synthetic OLX-shaped events: Kafka (KRaft) + MinIO in Docker, Java replay, Spark Structured
# Streaming to MinIO, stream-vs-batch and Spark-vs-pandas parity. Numbers from this runner are not
# the README numbers (those come from the MacBook run on the real 65.5M events).
on:
  push:
    paths: ["pathrank/streaming/**", "streaming/**", "scripts/stream*", "deploy/docker-compose.yml",
            "configs/*streaming*", ".github/workflows/streaming.yml"]
  pull_request:
    paths: ["pathrank/streaming/**", "streaming/**", "scripts/stream*"]
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17", cache: maven}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-streaming.txt numpy pyyaml pytest
      - run: cd streaming/producer && mvn -B -q -DskipTests package
      - name: no-Docker smoke + tests
        run: make stream-smoke && pytest -q -p no:warnings tests/test_streaming.py
      - run: docker compose -f deploy/docker-compose.yml --profile streaming up -d --wait kafka minio
      - name: end-to-end on 1M synthetic events
        run: |
          python scripts/streaming.py synth --config configs/olx_streaming.yaml --n 1000000 --out data/ci/events.parquet
          EVENTS=data/ci/events.parquet LAG_N=300000 RATE=20000 \
            CFG=configs/olx_streaming.yaml bash scripts/stream_bench.sh
        env:
          PYTHONUNBUFFERED: "1"
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: streaming-results, path: results/streaming}
