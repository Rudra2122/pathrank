# Tiny config for CI and pytest (~1 minute).
data:
  source: synthetic
  raw_dir: data/raw_ci
  processed_dir: data/processed_ci
  synth_users: 4000
  synth_jobs: 6000
  synth_apps: 50000
artifacts_dir: artifacts_ci
mlflow: true
mlflow_uri: sqlite:///artifacts_ci/mlflow.db
text: {backend: tfidf, tfidf_dim: 32, tfidf_fit_rows: 20000}
two_tower: {epochs: 1, hash_buckets: 16384, dim: 32, hidden: 64}
lightgcn: {epochs: 2, dim: 32}
retrieval: {k_two_tower: 100, k_text: 50, k_gcn: 30, k_locpop: 30}
ranker: {train_users: 500, eval_users: 500, n_estimators: 50, early_stopping: 10}
notify: {snapshot_every_days: 7}
agent: {eval_users: 5, provider: template}
